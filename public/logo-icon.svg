<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Background Shield/Hexagon -->
  <polygon points="60,6 110,34 110,86 60,114 10,86 10,34" fill="#0A101D" stroke="url(#grad1)" stroke-width="3.5" />
  <!-- Inner Technical Grid Lines -->
  <line x1="60" y1="6" x2="60" y2="114" stroke="rgba(0,240,255,0.15)" stroke-dasharray="3,3" />
  <line x1="10" y1="60" x2="110" y2="60" stroke="rgba(0,240,255,0.15)" stroke-dasharray="3,3" />
  <!-- Monogram HS -->
  <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- H -->
    <line x1="32" y1="36" x2="32" y2="84" />
    <line x1="52" y1="36" x2="52" y2="84" />
    <line x1="32" y1="60" x2="52" y2="60" />
    <!-- S -->
    <path d="M 88 44 C 88 38, 70 34, 68 46 C 66 56, 88 56, 86 72 C 84 84, 66 84, 66 76" stroke="url(#grad1)" stroke-width="7.5" />
  </g>
  <!-- Focal Node Point -->
  <circle cx="60" cy="60" r="4" fill="#00F0FF" />
</svg>
